{% extends "base.html" %}
{% from "macros.html" import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div style="display:grid;place-items:center;min-height:{{ '60vh' if session.user else '100vh' }};padding:1rem">
  <section class="panel panel-body" style="max-width:460px;text-align:center">
    <span class="kpi-icon tone-bad" style="margin:0 auto 1rem">{{ icon('alert') }}</span>
    <h1 style="font-size:1.4rem">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <a href="{{ url_for('dashboard') }}">Terug naar het dashboard</a>
  </section>
</div>
{% endblock %}
